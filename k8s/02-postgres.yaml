apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-db
  namespace: ridesure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-db
  template:
    metadata:
      labels:
        app: policy-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: policy-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: policy-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: policy-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ridesure", "-d", "policy_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: policy-db
  namespace: ridesure
spec:
  selector:
    app: policy-db
  ports:
    - port: 5432
      targetPort: 5432