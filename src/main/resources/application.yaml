server:
  port: 8080

spring:
  application:
    name: policy-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/policy_db}
    username: ${DB_USER:ridesure}
    password: ${DB_PASSWORD:ridesure}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true